name: Dust baseline synthetic checks

on:
  push:
    branches: ['feat/**', 'fix/**', 'chore/**']
    paths:
      - 'dust/**'
      - '*_dust.py'
      - 'benchmark_validation.py'
      - 'models/fps_control.py'
      - 'models/pointnet2*'
      - 'tests/test_dust*.py'
      - 'requirements-dust.txt'
      - '.github/workflows/dust-tests.yml'
  pull_request:
    paths:
      - 'dust/**'
      - '*_dust.py'
      - 'benchmark_validation.py'
      - 'models/fps_control.py'
      - 'models/pointnet2*'
      - 'tests/test_dust*.py'
      - 'requirements-dust.txt'
      - '.github/workflows/dust-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dust-checks-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-dust.txt
      - run: python -m pip install -r requirements-dust.txt
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Synthetic alignment, voting, metrics and MSG tensor checks
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: python -m unittest discover -s tests -p 'test_dust*.py' -v
